name: Rebuild tab index

on:
  push:
    branches: [main]
    paths:
      - "tabs/**/*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-tab-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild tabs/index.json
        run: node scripts/build-index.mjs

      - name: Commit if the index changed
        run: |
          if git diff --quiet -- tabs/index.json; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tabs/index.json
          git commit -m "Rebuild tab index"
          git push
