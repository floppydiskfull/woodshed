name: Enable GitHub Pages

# One-time setup: points GitHub Pages at the main branch root, then this file
# can be deleted. Safe to re-run; it updates the source if the site exists.
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages to deploy from main / (root)
        run: |
          create_status=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "create: HTTP $create_status"
          cat /tmp/create.json
          if [ "$create_status" = "201" ]; then
            echo "Pages site created, deploying from main /."
            exit 0
          fi
          if [ "$create_status" = "409" ]; then
            update_status=$(curl -s -o /tmp/update.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
            echo "update: HTTP $update_status"
            cat /tmp/update.json
            [ "$update_status" = "204" ] && exit 0
          fi
          exit 1
