name: Enable GitHub Pages

# One-time setup: points GitHub Pages at the main branch root, then this file
# can be deleted. Safe to re-run; it updates the source if the site exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/enable-pages.yml"]

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages to deploy from main / (root)
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          auth='Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}'
          accept='Accept: application/vnd.github+json'

          create_status=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
            -H "$auth" -H "$accept" "$api" -d '{"build_type":"workflow"}')
          echo "create (workflow mode): HTTP $create_status"
          cat /tmp/create.json

          update_status=$(curl -s -o /tmp/update.json -w "%{http_code}" -X PUT \
            -H "$auth" -H "$accept" "$api" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "update (switch to branch deploy): HTTP $update_status"
          cat /tmp/update.json
          [ "$update_status" = "204" ] && exit 0
          exit 1
